name: cash-book CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: cash-book/package-lock.json

      - name: Install all dependencies
        working-directory: cash-book
        run: npm ci

      - name: Run typescript compiler
        working-directory: cash-book
        run: npm run compile

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: cash-book/package-lock.json

      - name: Install all dependencies
        working-directory: cash-book
        run: npm ci

      - name: Run tests
        working-directory: cash-book
        run: npm run coverage

      - name: Run build
        working-directory: cash-book
        run: npm run build

  integration-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: cash-book-integration-tests/package-lock.json

      - name: Install all cash-book dependencies
        working-directory: cash-book
        run: npm ci

      - name: Install all cash-book-integration-tests dependencies
        working-directory: cash-book-integration-tests
        run: npm ci

      - name: Install Playwright
        working-directory: cash-book-integration-tests
        run: npx playwright install --with-deps

      - name: Run integration tests
        working-directory: cash-book-integration-tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: cash-book-integration-tests/playwright-report/
          if-no-files-found: warn
          retention-days: 30
